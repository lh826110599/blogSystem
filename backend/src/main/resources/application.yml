# =====================================================================
# 博客系统 V1 后端配置
# 写法 ${环境变量名:默认值}：优先读环境变量，读不到用冒号后的默认值。
# 本地开发直接用默认值即可；部署时通过环境变量覆盖密码、密钥，避免把真实密码提交到 Git。
# =====================================================================

server:
  port: 8080
  servlet:
    # 所有接口统一加 /api 前缀，例如登录接口完整地址：http://localhost:8080/api/auth/login
    context-path: /api

spring:
  application:
    name: blog-backend

  # ---------- 环境切换 ----------
  # 数据源配置拆到了 profile 文件里，这里选择启用哪一个：
  #   mysql → application-mysql.yml，连接本地 MySQL 8 的 blogsystem 库（默认）
  #   h2    → application-h2.yml，嵌入式数据库，没有 MySQL 的电脑上也能跑
  # 临时切换不用改文件：设置环境变量 SPRING_PROFILES_ACTIVE=h2 再启动即可（环境变量优先级更高）
  profiles:
    active: mysql

  # ---------- 连接池：Spring Boot 默认 HikariCP，h2 / mysql 共用 ----------
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # ---------- Redis（Spring Boot 3 的配置前缀是 spring.data.redis） ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s

  # ---------- Jackson ----------
  jackson:
    # 时区统一东八区；LocalDateTime 的格式在实体字段上用 @JsonFormat 指定
    time-zone: GMT+8
    # 值为 null 的字段也返回给前端，方便前端知道有这个字段
    default-property-inclusion: always

# ---------- MyBatis-Plus ----------
mybatis-plus:
  # 自定义 SQL 的 XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # XML 里 resultType 可以直接写类名，不用写全限定名
  type-aliases-package: com.blog.entity
  configuration:
    # 数据库下划线字段 create_time 自动映射到 Java 驼峰属性 createTime
    map-underscore-to-camel-case: true
    # 开发阶段在控制台打印执行的 SQL，方便学习；上线前改成 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：调用 deleteById 时实际执行 UPDATE ... SET deleted = 1，查询自动带 deleted = 0
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- springdoc（Knife4j 底层） ----------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: blog
      paths-to-match: /**
      # 只扫描 controller 包，避免把框架内部接口也生成文档
      packages-to-scan: com.blog.controller

# ---------- Knife4j 增强 ----------
knife4j:
  enable: true
  setting:
    language: zh_cn

# ---------- JWT（对应 com.blog.config.JwtProperties） ----------
jwt:
  # HS256 签名密钥，长度至少 32 个字符（256 位），否则启动时 jjwt 会抛 WeakKeyException
  # 默认值只用于本地开发，部署时务必通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:blog-v1-dev-secret-key-please-change-me-0123456789}
  # token 有效期，单位：秒（86400 = 24 小时）
  expire: 86400
  # 前端放 token 的请求头名称
  header: Authorization
  # token 前缀，请求头格式：Authorization: Bearer xxxxx.yyyyy.zzzzz
  token-prefix: "Bearer "

# ---------- 日志 ----------
logging:
  level:
    com.blog: debug
